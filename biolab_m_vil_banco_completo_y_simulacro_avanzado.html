<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioLab Móvil — Banco de Estudio Universitario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* Tipografía base y comportamiento táctil mobile-first */
    :root {
      color-scheme: light;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #eef3f0;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Utilidades de animación 3D para flashcards */
    .perspective-1000 {
      perspective: 1000px;
    }

    .preserve-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Scrollbar sutil en filtros horizontales */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-up {
      animation: fadeSlideUp 0.24s ease-out both;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start sm:py-4">
  <!-- Contenedor tipo aplicación móvil en pantallas grandes y fluido en celular -->
  <div
    id="app-shell"
    class="w-full max-w-md sm:max-w-lg min-h-screen sm:min-h-[88vh] bg-slate-50 sm:rounded-[28px] sm:shadow-2xl sm:border sm:border-emerald-950/10 flex flex-col relative overflow-x-hidden"
  >
    <!-- Encabezado superior fijo de la app -->
    <header class="sticky top-0 z-30 bg-emerald-950 text-white px-4 pt-4 pb-3.5 shadow-md">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <!-- Logo SVG de Biología Celular -->
          <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center shrink-0">
            <svg viewBox="0 0 36 36" class="w-6 h-6 text-emerald-300" fill="none" stroke="currentColor" stroke-width="2">
              <ellipse cx="18" cy="18" rx="13" ry="9" transform="rotate(-24 18 18)" />
              <circle cx="18" cy="18" r="4.2" fill="currentColor" class="text-teal-300" />
              <circle cx="10.5" cy="14" r="1.5" fill="currentColor" class="text-amber-300" stroke="none" />
              <circle cx="25.5" cy="22" r="1.5" fill="currentColor" class="text-amber-300" stroke="none" />
            </svg>
          </div>
          <div class="min-w-0">

            <p class="text-[11px] text-emerald-200/90 font-medium truncate">
              Biología Universitaria • Estudio Interactivo
            </p>
          </div>
        </div>

        <!-- Indicador rápido de dominio de flashcards -->
        <div
      id="header-mastery-badge"
      class="px-2.5 py-1.5 rounded-xl bg-emerald-900/90 border border-emerald-700/60 text-[11px] font-semibold text-emerald-100 shrink-0"

      0/36 dom.
    </div>
  </div>

  <!-- Sub-barra dinámica según pestaña activa -->
  <div id="header-subbar" class="mt-3 pt-2.5 border-t border-emerald-800/70 flex items-center justify-between text-xs text-emerald-100/90">
    <span>Modo: Conceptos y Diagramas</span>
    <span class="text-emerald-300 font-semibold">4 Bloques Temáticos</span>
  </div>
</header>

<!-- Área de contenido principal desplazable -->

          quizConfig: mergedConfig,
          quizAnswers: parsed.quizAnswers || {},
          masteredCards: cleanedMastered,
          flashcardShuffledMode: Boolean(parsed.flashcardShuffledMode),
          flashcardOrder: completeOrder
        };
      } catch (err) {
        return structuredClone(defaultState);
      }
    }

    let state = loadState();
    let quizTimerInterval = null;
    let confirmResetAllPending = false;
    let confirmResetMasteryPending = false;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        // Ignorar errores de cuota de almacenamiento
      }
    }

    let toastTimeout = null;
    function showToast(message) {
      const toast = document.getElementById('toast-banner');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2400);
    }

    function formatClock(totalSeconds) {
      const safe = Math.max(0, Math.floor(totalSeconds || 0));
      const mins = Math.floor(safe / 60);
      const secs = safe % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function shuffleArray(source) {
      const arr = [...source];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function stopQuizTimer() {
      if (quizTimerInterval) {
        clearInterval(quizTimerInterval);
        quizTimerInterval = null;
      }
    }

    function recordHistoricalStats(questionIds) {
      const answeredIds = questionIds.filter((id) => Boolean(state.quizAnswers[id]));
      const correctCount = answeredIds.filter((id) => Boolean(state.quizAnswers[id]?.isCorrect)).length;
      state.quizStats.sessionsCompleted += 1;
      state.quizStats.totalAnswered += answeredIds.length;
      state.quizStats.totalCorrect += correctCount;
    }

    function finishQuizSession(timedOut = false) {
      stopQuizTimer();
      if (!state.quizConfig.sessionFinished) {
        recordHistoricalStats(state.quizConfig.activeQuestionIds || []);
      }
      state.quizConfig.sessionFinished = true;
      state.quizConfig.timedOut = timedOut;
      saveState();
      renderApp();
      if (timedOut) {
        showToast('¡Tiempo agotado! Simulacro enviado automáticamente.');
      } else {
        showToast('Simulacro finalizado. Revisa tu diagnóstico.');
      }
    }

    function syncQuizTimerDisplay() {
      const cfg = state.quizConfig;
      const clockEl = document.getElementById('quiz-live-clock');
      const bannerEl = document.getElementById('quiz-timer-box');
      if (!clockEl || !bannerEl || cfg.remainingSeconds === null) return;

      clockEl.textContent = formatClock(cfg.remainingSeconds);

      if (cfg.remainingSeconds <= 60) {
        bannerEl.className = 'rounded-2xl px-3.5 py-2.5 border flex items-center justify-between bg-rose-50 border-rose-400 text-rose-950 animate-pulse';
      } else if (cfg.remainingSeconds <= 180) {
        bannerEl.className = 'rounded-2xl px-3.5 py-2.5 border flex items-center justify-between bg-amber-50 border-amber-400 text-amber-950';
      } else {
        bannerEl.className = 'rounded-2xl px-3.5 py-2.5 border flex items-center justify-between bg-emerald-50/90 border-emerald-200 text-emerald-950';
      }
    }

    function ensureQuizTimerRunning() {
      stopQuizTimer();
      const cfg = state.quizConfig;
      if (
        state.activeTab !== 'quiz' ||
        !cfg.sessionStarted ||
        cfg.sessionFinished ||
        cfg.remainingSeconds === null
      ) {
        return;
      }

      syncQuizTimerDisplay();
      quizTimerInterval = setInterval(() => {
        if (
          state.activeTab !== 'quiz' ||
          !state.quizConfig.sessionStarted ||
          state.quizConfig.sessionFinished ||
          state.quizConfig.remainingSeconds === null
        ) {
          stopQuizTimer();
          return;
        }

        state.quizConfig.remainingSeconds -= 1;
        if (state.quizConfig.remainingSeconds <= 0) {
          state.quizConfig.remainingSeconds = 0;
          saveState();
          finishQuizSession(true);
        } else {
          if (state.quizConfig.remainingSeconds % 5 === 0) {
            saveState();
          }
          syncQuizTimerDisplay();
        }
      }, 1000);
    }

    function getPoolByFilters() {
      const cfg = state.quizConfig;
      if (Array.isArray(cfg.reviewOnlyIds) && cfg.reviewOnlyIds.length > 0) {
        const setIds = new Set(cfg.reviewOnlyIds);
        return QUIZ_QUESTIONS.filter((q) => setIds.has(q.id));
      }
      return QUIZ_QUESTIONS.filter((q) => {
        const topicOk = state.quizTopic === 'all' || q.topic === state.quizTopic;
        const typeOk = state.quizType === 'all' || q.type === state.quizType;
        return topicOk && typeOk;
      });
    }

    function startConfiguredQuiz(overrideIds = null) {
      if (Array.isArray(overrideIds) && overrideIds.length > 0) {
        state.quizConfig.reviewOnlyIds = [...overrideIds];
      }

      const pool = getPoolByFilters();
      if (pool.length === 0) {
        showToast('No hay preguntas disponibles para iniciar.');
        return;
      }

      const cfg = state.quizConfig;
      const requested = Array.isArray(overrideIds) && overrideIds.length > 0
        ? overrideIds.length
        : (Number(cfg.questionCount) || 20);
      const clampedCount = Math.max(1, Math.min(pool.length, requested));

      const orderedPool = cfg.shuffleQuestions ? shuffleArray(pool) : [...pool];
      const selected = orderedPool.slice(0, clampedCount);

      const optionsMap = {};
      selected.forEach((q) => {
        if (q.type === 'mcq') {
          optionsMap[q.id] = cfg.shuffleOptions ? shuffleArray(q.options) : [...q.options];
        } else if (q.type === 'tf') {
          optionsMap[q.id] = [...q.options];
        }
      });

      const minutes = Number(cfg.timerMinutes) || 0;
      cfg.questionCount = clampedCount;
      cfg.activeQuestionIds = selected.map((q) => q.id);
      cfg.shuffledOptionsMap = optionsMap;
      cfg.remainingSeconds = minutes > 0 ? Math.round(minutes * 60) : null;
      cfg.timedOut = false;
      cfg.sessionStarted = true;
      cfg.sessionFinished = false;

      state.quizAnswers = {};
      state.quizIndex = 0;
      saveState();
      renderApp();
      showToast(`Simulacro iniciado: ${clampedCount} preguntas${minutes > 0 ? ` • ${minutes} min` : ' • Sin límite'}.`);
    }

    function openQuizConfigurator() {
      stopQuizTimer();
      confirmResetAllPending = false;
      state.quizConfig.reviewOnlyIds = [];
      state.quizConfig.sessionStarted = false;
      state.quizConfig.sessionFinished = false;
      state.quizConfig.timedOut = false;
      saveState();
      renderApp();
    }

    function getFilteredFlashcardIds() {
      const idToCard = new Map(FLASHCARDS.map((c) => [c.id, c]));
      const masteredSet = new Set(state.masteredCards);

      return state.flashcardOrder.filter((id) => {
        const card = idToCard.get(id);
        if (!card) return false;
        const topicOk = state.flashcardTopic === 'all' || card.topic === state.flashcardTopic;
        const unmasteredOk = !state.flashcardOnlyUnmastered || !masteredSet.has(card.id);
        return topicOk && unmasteredOk;
      });
    }

    /* =========================================================================
       7. RENDERIZADO DE COMPONENTES Y PESTAÑAS
       ========================================================================= */
    function populateBilayerSvg() {
      const group = document.getElementById('bilayer-group');
      if (!group) return;
      group.innerHTML = '';
      const startX = 198;
      const count = 9;
      const spacing = 17;

      for (let i = 0; i < count; i++) {
        const x = startX + i * spacing;
        // Fila superior: cabeza hidrófila (azul) + dos colas hidrófobas (naranja)
        group.innerHTML += `
          <line x1="${x - 2.5}" y1="53" x2="${x - 2.5}" y2="67" stroke="#ea580c" stroke-width="1.4" />
          <line x1="${x + 2.5}" y1="53" x2="${x + 2.5}" y2="67" stroke="#ea580c" stroke-width="1.4" />
          <circle cx="${x}" cy="49" r="5" fill="#0284c7" />
        `;
        // Fila inferior: dos colas hidrófobas hacia arriba + cabeza hidrófila abajo
        group.innerHTML += `
          <line x1="${x - 2.5}" y1="85" x2="${x - 2.5}" y2="71" stroke="#ea580c" stroke-width="1.4" />
          <line x1="${x + 2.5}" y1="85" x2="${x + 2.5}" y2="71" stroke="#ea580c" stroke-width="1.4" />
          <circle cx="${x}" cy="89" r="5" fill="#0284c7" />
        `;
      }
    }

                class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-[11px] font-bold hover:bg-slate-200 min-h-[34px]"
              >
                ⚙️ Configurar
              </button>
              <button
                type="button"
                id="finish-quiz-now-btn"
                class="px-3 py-1.5 rounded-xl bg-teal-900 text-white text-[11px] font-bold hover:bg-teal-950 min-h-[34px]"
              >
                Finalizar y corregir (${answeredCount}/${filtered.length})
              </button>
            </div>
          </div>

          <article class="bg-white rounded-3xl border border-slate-200/90 p-4 shadow-xs space-y-4">
            <div class="flex items-center justify-between gap-2">
              <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-teal-100 text-teal-900">
                ${typeBadgeLabel}
              </span>
              <span class="text-[11px] font-semibold text-slate-400">Banco #${q.id}</span>
            </div>

            <h2 class="text-base font-extrabold text-slate-900 leading-snug">${q.question}</h2>

            ${q.type === 'mcq' || q.type === 'tf' ? `
              <div class="space-y-2.5">
                ${displayOptions.map((opt, idx) => {
                  const letter = String.fromCharCode(65 + idx);
                  const isChosen = savedAnswer && savedAnswer.selected === opt;
                  const isRight = opt === q.answer;

                  let btnClass = 'bg-slate-50 border-slate-200 text-slate-800 hover:bg-emerald-50/70 hover:border-emerald-300';
                  if (showImmediateFeedback) {
                    if (isRight) {
                      btnClass = 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-1 ring-emerald-500';
                    } else if (isChosen && !isRight) {
                      btnClass = 'bg-rose-50 border-rose-400 text-rose-950';
                    } else {
                      btnClass = 'bg-slate-50/70 border-slate-200 text-slate-500';
                    }
                  } else if (isChosen) {
                    btnClass = 'bg-teal-50 border-teal-600 text-teal-950 ring-1 ring-teal-600';
                  }

                  return `
                    <button
                      type="button"
                      data-quiz-option="${encodeURIComponent(opt)}"
                      class="w-full text-left p-3.5 rounded-2xl border text-xs sm:text-sm font-semibold transition-all flex items-start gap-3 min-h-[48px] ${btnClass}"
                    >
                      <span class="w-6 h-6 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-xs font-extrabold shrink-0">
                        ${q.type === 'mcq' ? letter : (opt === 'Verdadero' ? 'V' : 'F')}
                      </span>
                      <span class="leading-snug pt-0.5">${opt}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            ` : `
              <div class="space-y-3">
                <label for="short-answer-input" class="block text-xs font-bold text-slate-600">
                  Redacta tu respuesta breve antes de revelar la respuesta modelo:
                </label>
                <textarea
                  id="short-answer-input"
                  rows="3"
                  placeholder="Escribe aquí los conceptos clave de tu respuesta..."
                  class="w-full rounded-2xl border border-slate-300 bg-slate-50 p-3 text-sm text-slate-900 focus:border-emerald-600 focus:bg-white focus:outline-none"
                >${savedAnswer?.userText || ''}</textarea>

                <button
                  type="button"
                  id="reveal-short-answer-btn"
                  class="w-full py-3 px-4 rounded-2xl bg-emerald-700 text-white text-xs font-extrabold shadow-xs hover:bg-emerald-800 transition min-h-[46px]"
                >
                  ${savedAnswer ? 'Actualizar respuesta guardada' : (cfg.feedbackMode === 'immediate' ? 'Comprobar y ver respuesta modelo' : 'Guardar respuesta')}
                </button>
              </div>
            `}

            ${showImmediateFeedback ? `
              <div class="rounded-2xl p-3.5 border ${
                savedAnswer.isCorrect
                  ? 'bg-emerald-50/90 border-emerald-300 text-emerald-950'
                  : 'bg-amber-50/90 border-amber-300 text-amber-950'
              } space-y-1.5">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-extrabold uppercase tracking-wider">
                    ${savedAnswer.isCorrect ? '✓ Respuesta correcta' : '✕ Revisa este concepto'}
                  </span>
                  ${q.type === 'short' ? `
                    <div class="flex gap-1.5">
                      <button type="button" data-self-grade="true" class="px-2.5 py-1 rounded-lg bg-emerald-700 text-white text-[11px] font-bold">La supe</button>
                      <button type="button" data-self-grade="false" class="px-2.5 py-1 rounded-lg bg-amber-700 text-white text-[11px] font-bold">Repasar</button>
                    </div>
                  ` : ''}
                </div>
                <p class="text-xs font-bold">Respuesta esperada: ${q.answer}</p>
                <p class="text-xs leading-relaxed opacity-90">${q.explanation}</p>
              </div>
            ` : ''}

            ${Boolean(savedAnswer) && cfg.feedbackMode === 'end' ? `
              <div class="rounded-2xl px-3.5 py-2.5 bg-teal-50 border border-teal-200 text-teal-950 text-xs font-semibold">
                ✓ Respuesta registrada. Se corregirá al finalizar el simulacro.
              </div>
            ` : ''}
          </article>

          <div class="grid grid-cols-2 gap-2.5">
            <button
              type="button"
              id="prev-quiz-btn"
              class="py-3 px-4 rounded-2xl bg-white border border-slate-200 text-xs font-extrabold text-slate-700 hover:bg-slate-100 transition min-h-[46px]"
            >
              ← Anterior
            </button>
            <button
              type="button"
              id="next-quiz-btn"
              class="py-3 px-4 rounded-2xl bg-emerald-800 text-white text-xs font-extrabold hover:bg-emerald-900 transition min-h-[46px]"
            >
              ${state.quizIndex === filtered.length - 1 ? 'Finalizar examen ✓' : 'Siguiente →'}
            </button>
          </div>
        </div>
      `;

      ensureQuizTimerRunning();

      container.querySelectorAll('[data-jump-quiz]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.quizIndex = Number(btn.dataset.jumpQuiz) || 0;
          saveState();
          renderApp();
        });
      });

      document.getElementById('reconfigure-quiz-btn')?.addEventListener('click', openQuizConfigurator);

      document.getElementById('finish-quiz-now-btn')?.addEventListener('click', () => {
        finishQuizSession(false);
      });

      container.querySelectorAll('[data-quiz-option]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const chosen = decodeURIComponent(btn.dataset.quizOption);
          state.quizAnswers[q.id] = {
            selected: chosen,
            userText: chosen,
            isCorrect: chosen === q.answer
          };
          saveState();
          renderApp();
        });
      });

      document.getElementById('reveal-short-answer-btn')?.addEventListener('click', () => {
        const inputEl = document.getElementById('short-answer-input');
        const userText = (inputEl?.value || '').trim();
        const normalized = userText.toLowerCase();
        const hits = (q.keywords || []).filter((kw) => normalized.includes(kw.toLowerCase())).length;
        const autoPass = hits >= Math.min(2, (q.keywords || []).length);

        state.quizAnswers[q.id] = {
          userText,
          isCorrect: autoPass
        };
        saveState();
        renderApp();
        if (cfg.feedbackMode === 'end') {
          showToast('Respuesta corta guardada.');
        }
      });

      container.querySelectorAll('[data-self-grade]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (!state.quizAnswers[q.id]) return;
          state.quizAnswers[q.id].isCorrect = btn.dataset.selfGrade === 'true';
          saveState();
          renderApp();
        });
      });

      document.getElementById('prev-quiz-btn')?.addEventListener('click', () => {
        state.quizIndex = (state.quizIndex - 1 + filtered.length) % filtered.length;
        saveState();
        renderApp();
      });

      document.getElementById('next-quiz-btn')?.addEventListener('click', () => {
        if (state.quizIndex === filtered.length - 1) {
          finishQuizSession(false);
        } else {
          state.quizIndex += 1;
          saveState();
          renderApp();
        }
      });
    }

    /* ----------------- PESTAÑA 3: FLASHCARDS 3D ----------------- */
    function renderFlashcardsTab(container) {
      const topicFilters = [
        { id: 'all', label: 'Todas' },
        { id: 'celula', label: 'Célula' },
        { id: 'quimica_agua', label: 'Química y Agua' },
        { id: 'biomoleculas_origen', label: 'Biomoléculas y Origen' },
        { id: 'metabolismo_division', label: 'Metabolismo y División' }
      ];
      const topicLabels = {
        celula: 'Célula',
        quimica_agua: 'Química y Agua',
        biomoleculas_origen: 'Biomoléculas y Origen',
        metabolismo_division: 'Metabolismo y División'
      };

      const idToCard = new Map(FLASHCARDS.map((c) => [c.id, c]));
      const visibleIds = getFilteredFlashcardIds();

      if (visibleIds.length === 0) {
        container.innerHTML = `
          <div class="animate-fade-up space-y-4">
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
              ${topicFilters.map((f) => {
                const active = state.flashcardTopic === f.id;
                return `
                  <button
                    type="button"
                    data-fc-topic="${f.id}"
                    class="px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition min-h-[38px] ${
                      active ? 'bg-emerald-700 text-white' : 'bg-white border border-slate-200 text-slate-700'
                    }"
                  >
                    ${f.label}
                  </button>
                `;
              }).join('')}
            </div>

            <div class="bg-white rounded-3xl border border-emerald-200 p-6 text-center space-y-3 shadow-xs">
              <p class="text-base font-extrabold text-emerald-950">¡Todas las tarjetas de este filtro están dominadas!</p>
              <p class="text-xs text-slate-600">Desactiva "Solo pendientes" o cambia el bloque temático para seguir repasando.</p>
              <button
                type="button"
                id="disable-unmastered-filter-btn"
                class="py-2.5 px-4 rounded-2xl bg-emerald-700 text-white text-xs font-extrabold min-h-[42px]"
              >
                Ver todas las tarjetas
              </button>
            </div>
          </div>
        `;

        container.querySelectorAll('[data-fc-topic]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.flashcardTopic = btn.dataset.fcTopic;
            state.flashcardIndex = 0;
            state.flashcardFlipped = false;
            saveState();
            renderApp();
          });
        });

        document.getElementById('disable-unmastered-filter-btn')?.addEventListener('click', () => {
          state.flashcardOnlyUnmastered = false;
          state.flashcardIndex = 0;
          state.flashcardFlipped = false;
          saveState();
          renderApp();
        });
        return;
      }

      if (state.flashcardIndex >= visibleIds.length) {
        state.flashcardIndex = 0;
      }

      const currentCardId = visibleIds[state.flashcardIndex];
      const card = idToCard.get(currentCardId) || FLASHCARDS[0];
      const isMastered = state.masteredCards.includes(card.id);
      const isRandom = Boolean(state.flashcardShuffledMode);

      container.innerHTML = `
        <div class="animate-fade-up space-y-3.5">
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${topicFilters.map((f) => {
              const active = state.flashcardTopic === f.id;
              return `
                <button
                  type="button"
                  data-fc-topic="${f.id}"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition min-h-[36px] ${
                    active ? 'bg-emerald-700 text-white' : 'bg-white border border-slate-200 text-slate-700'
                  }"
                >
                  ${f.label}
                </button>
              `;
            }).join('')}
          </div>

          <div class="bg-white rounded-2xl border border-slate-200/90 p-3 space-y-2.5 shadow-2xs">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-700">
                  Tarjeta ${state.flashcardIndex + 1} de ${visibleIds.length}
                </span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                  isRandom ? 'bg-teal-100 text-teal-900' : 'bg-slate-100 text-slate-600'
                }">
                  ${isRandom ? 'Aleatoria' : 'Ordenada'}
                </span>
              </div>
              <div class="flex gap-1.5">
                <button
                  type="button"
                  id="shuffle-cards-btn"
                  class="px-2.5 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-900 hover:bg-emerald-100 transition min-h-[36px]"
                >
                  🔀 Aleatorizar
                </button>
                <button
                  type="button"
                  id="order-cards-btn"
                  class="px-2.5 py-1.5 rounded-xl bg-slate-100 text-xs font-bold text-slate-700 hover:bg-slate-200 transition min-h-[36px]"
                >
                  1–${FLASHCARDS.length}
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-100">
              <button
                type="button"
                id="toggle-unmastered-btn"
                class="px-3 py-1.5 rounded-xl text-[11px] font-bold transition min-h-[34px] ${
                  state.flashcardOnlyUnmastered
                    ? 'bg-amber-100 text-amber-950 border border-amber-300'
                    : 'bg-slate-100 text-slate-700'
                }"
              >
                ${state.flashcardOnlyUnmastered ? '✓ Mostrando solo pendientes' : 'Filtrar solo pendientes'}
              </button>

              ${state.masteredCards.length > 0 ? (
                confirmResetMasteryPending ? `
                  <div class="flex items-center gap-1">
                    <button type="button" id="confirm-reset-mastery-btn" class="px-2 py-1 rounded-lg bg-rose-700 text-white text-[10px] font-extrabold">Confirmar</button>
                    <button type="button" id="cancel-reset-mastery-btn" class="px-2 py-1 rounded-lg bg-slate-200 text-slate-700 text-[10px] font-bold">No</button>
                  </div>
                ` : `
                  <button
                    type="button"
                    id="ask-reset-mastery-btn"
                    class="px-2.5 py-1 rounded-xl text-[11px] font-bold text-slate-500 hover:text-rose-700"
                  >
                    Reiniciar dominio
                  </button>
                `
              ) : ''}
            </div>
          </div>

          <div
            id="flashcard-flip-area"
            role="button"
            tabindex="0"
            aria-label="Tarjeta de estudio interactiva. Toca para voltear."
            class="perspective-1000 w-full cursor-pointer select-none"
          >
            <div class="relative w-full min-h-[260px] transition-transform duration-500 preserve-3d ${
              state.flashcardFlipped ? 'rotate-y-180' : ''
            }">
              <div class="backface-hidden w-full min-h-[260px] rounded-3xl bg-white border-2 ${
                isMastered ? 'border-emerald-500' : 'border-slate-200'
              } p-6 shadow-md flex flex-col justify-between">
                <div class="flex items-center justify-between gap-2">
                  <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-emerald-100 text-emerald-900">
                    Frente • ${topicLabels[card.topic] || ''} #${card.id}
                  </span>
                  ${isMastered ? '<span class="text-xs font-extrabold text-emerald-700">✓ Dominada</span>' : ''}
                </div>

                <div class="my-4">
                  <p class="text-lg font-extrabold text-slate-900 leading-snug">${card.front}</p>
                </div>

                <p class="text-xs font-semibold text-emerald-700">Toca para voltear • Desliza ← → para cambiar</p>
              </div>

              <div class="backface-hidden rotate-y-180 absolute inset-0 w-full min-h-[260px] rounded-3xl bg-emerald-950 text-white p-6 shadow-md flex flex-col justify-between">
                <div class="flex items-center justify-between">
                  <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-emerald-800 text-emerald-200">
                    Dorso • Definición clave
                  </span>
                  <span class="text-xs font-bold text-emerald-300">#${card.id}</span>
                </div>

                <div class="my-4">
                  <p class="text-base font-semibold leading-relaxed text-white">${card.back}</p>
                </div>

                <p class="text-xs font-medium text-emerald-300">Toca nuevamente para volver al frente</p>
              </div>
            </div>
          </div>

          <button
            type="button"
            id="toggle-mastered-btn"
            class="w-full py-3.5 px-4 rounded-2xl text-xs font-extrabold transition-all min-h-[48px] ${
              isMastered
                ? 'bg-emerald-100 text-emerald-950 border border-emerald-300'
                : 'bg-emerald-700 text-white shadow-xs hover:bg-emerald-800'
            }"
          >
            ${isMastered ? '✓ Tarjeta dominada (tocar para desmarcar)' : 'Marcar tarjeta como dominada'}
          </button>

          <div class="grid grid-cols-2 gap-2.5">
            <button
              type="button"
              id="prev-card-btn"
              class="py-3 px-4 rounded-2xl bg-white border border-slate-200 text-xs font-extrabold text-slate-700 hover:bg-slate-100 transition min-h-[46px]"
            >
              ← Anterior
            </button>
            <button
              type="button"
              id="next-card-btn"
              class="py-3 px-4 rounded-2xl bg-slate-900 text-white text-xs font-extrabold hover:bg-slate-800 transition min-h-[46px]"
            >
              Siguiente →
            </button>
          </div>
        </div>
      `;

      container.querySelectorAll('[data-fc-topic]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.flashcardTopic = btn.dataset.fcTopic;
          state.flashcardIndex = 0;
          state.flashcardFlipped = false;
          saveState();
          renderApp();
        });
      });

      document.getElementById('toggle-unmastered-btn')?.addEventListener('click', () => {
        state.flashcardOnlyUnmastered = !state.flashcardOnlyUnmastered;
        state.flashcardIndex = 0;
        state.flashcardFlipped = false;
        saveState();
        renderApp();
      });

      document.getElementById('ask-reset-mastery-btn')?.addEventListener('click', () => {
        confirmResetMasteryPending = true;
        renderApp();
      });

      document.getElementById('cancel-reset-mastery-btn')?.addEventListener('click', () => {
        confirmResetMasteryPending = false;
        renderApp();
      });

      document.getElementById('confirm-reset-mastery-btn')?.addEventListener('click', () => {
        confirmResetMasteryPending = false;
        state.masteredCards = [];
        state.flashcardIndex = 0;
        state.flashcardFlipped = false;
        saveState();
        renderApp();
        showToast('Dominio de flashcards reiniciado.');
      });

      document.getElementById('flashcard-flip-area')?.addEventListener('click', () => {
        state.flashcardFlipped = !state.flashcardFlipped;
        saveState();
        renderApp();
      });

      // Soporte de deslizamiento táctil (swipe izquierda/derecha) en la flashcard
      let touchStartX = 0;
      const flipEl = document.getElementById('flashcard-flip-area');
      flipEl?.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0]?.clientX || 0;
      }, { passive: true });
      flipEl?.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0]?.clientX || 0;
        const deltaX = touchEndX - touchStartX;
        if (Math.abs(deltaX) > 48) {
          if (deltaX < 0) {
            state.flashcardIndex = (state.flashcardIndex + 1) % visibleIds.length;
          } else {
            state.flashcardIndex = (state.flashcardIndex - 1 + visibleIds.length) % visibleIds.length;
          }
          state.flashcardFlipped = false;
          saveState();
          renderApp();
        }
      }, { passive: true });

      document.getElementById('toggle-mastered-btn')?.addEventListener('click', () => {
        if (state.masteredCards.includes(card.id)) {
          state.masteredCards = state.masteredCards.filter((id) => id !== card.id);
        } else {
          state.masteredCards.push(card.id);
          showToast('¡Tarjeta marcada como dominada!');
        }
        saveState();
        renderApp();
      });

      document.getElementById('prev-card-btn')?.addEventListener('click', () => {
        state.flashcardIndex = (state.flashcardIndex - 1 + visibleIds.length) % visibleIds.length;
        state.flashcardFlipped = false;
        saveState();
        renderApp();
      });

      document.getElementById('next-card-btn')?.addEventListener('click', () => {
        state.flashcardIndex = (state.flashcardIndex + 1) % visibleIds.length;
        state.flashcardFlipped = false;
        saveState();
        renderApp();
      });

      document.getElementById('shuffle-cards-btn')?.addEventListener('click', () => {
        state.flashcardOrder = shuffleArray(FLASHCARDS.map((f) => f.id));
        state.flashcardShuffledMode = true;
        state.flashcardIndex = 0;
        state.flashcardFlipped = false;
        saveState();
        renderApp();
        showToast(`Mazo de ${FLASHCARDS.length} flashcards aleatorizado.`);
      });

      document.getElementById('order-cards-btn')?.addEventListener('click', () => {
        state.flashcardOrder = FLASHCARDS.map((f) => f.id);
        state.flashcardShuffledMode = false;
        state.flashcardIndex = 0;
        state.flashcardFlipped = false;
        saveState();
        renderApp();
        showToast('Mazo ordenado del 1 al 36.');
      });
    }

    /* ----------------- PESTAÑA 4: ERRORES COMUNES Y TRAMPAS ----------------- */

        const haystack = [trap.myth, trap.reality, trap.tip].join(' ').toLowerCase();
        return haystack.includes(query);
      });

      container.innerHTML = `

          <div class="bg-amber-950 text-amber-50 rounded-3xl p-4 shadow-xs">

            <input
              id="trap-search-input"
              type="search"

              placeholder="Filtrar trampas: mitosis, cohesión, O₂, Z..."
              aria-label="Buscar trampas de examen"
              class="w-full bg-transparent text-xs sm:text-sm font-medium text-slate-800 placeholder:text-slate-400 focus:outline-none py-1.5"
            />
            ${query ? `
              <button
                type="button"
                id="clear-trap-search-btn"
                class="px-2.5 py-1 rounded-xl bg-slate-100 text-slate-600 text-[11px] font-bold hover:bg-slate-200 shrink-0"
              >
                Limpiar
              </button>
            ` : ''}
          </div>

          ${filteredTraps.length > 0 ? filteredTraps.map((trap) => `
            <article class="bg-white rounded-3xl border border-slate-200/90 p-4 shadow-xs space-y-2.5">
              <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-rose-100 text-rose-800 text-xs font-extrabold flex items-center justify-center shrink-0">
                  !
                </span>
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-rose-700">
                  Confusión frecuente #${trap.id}
                </span>
              </div>

              <p class="text-sm font-extrabold text-slate-900 leading-snug">
                ✕ ${trap.myth}
              </p>

              <p class="text-xs text-slate-700 leading-relaxed bg-slate-50 rounded-2xl p-3 border border-slate-200/70">
                <strong class="text-emerald-800">✓ Lo correcto:</strong> ${trap.reality}
              </p>

              <div class="px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-200/80 text-xs font-bold text-emerald-950">
                💡 ${trap.tip}
              </div>
            </article>
          `).join('') : `
            <div class="bg-white rounded-3xl border border-slate-200 p-5 text-center space-y-2">
              <p class="text-sm font-bold text-slate-800">Sin trampas que coincidan con "${state.trapSearch}"</p>
            </div>
          `}
        </div>
      `;

      document.getElementById('trap-search-input')?.addEventListener('input', (e) => {
        state.trapSearch = e.target.value;
        saveState();
        renderApp();
        const inputEl = document.getElementById('trap-search-input');
        if (inputEl) {
          inputEl.focus();
          const len = inputEl.value.length;
          inputEl.setSelectionRange(len, len);
        }
      });

      document.getElementById('clear-trap-search-btn')?.addEventListener('click', () => {
        state.trapSearch = '';
        saveState();
        renderApp();
      });
    }

    /* =========================================================================
       8. ORQUESTACIÓN E INICIALIZACIÓN DE LA APP
       ========================================================================= */
    function renderApp() {
      const container = document.getElementById('main-content');
      if (!container) return;

      updateHeader();
      updateNavButtons();

      if (state.activeTab === 'conceptos') {
        stopQuizTimer();
        renderConceptosTab(container);
      } else if (state.activeTab === 'quiz') {
        renderQuizTab(container);
      } else if (state.activeTab === 'flashcards') {
        stopQuizTimer();
        renderFlashcardsTab(container);
      } else if (state.activeTab === 'trampas') {
        stopQuizTimer();
        renderTrampasTab(container);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.nav-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.activeTab = btn.dataset.tab;
          saveState();
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      renderApp();
    });
  </script>
</body>
</html>
